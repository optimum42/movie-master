{% extends "base.html" %}

{% block title %}Password required{% endblock %}

{% block nav_buttons %}
  <a href="{{ url_for('index') }}" class="bg-indigo-500 hover:bg-indigo-400 px-4 py-2 rounded transition-colors text-sm font-medium">← Back to Home</a>
{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-md border border-slate-200 mt-12">
  <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Password required</h2>
  
  <div class="text-center mb-8">
      <p class="text-sm text-slate-500 mt-1">Authorize to proceed</p>
  </div>

  <form action="{{ callback }}" method="POST" class="space-y-5">
      <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Enter password:</label>
          <input type="password" id="password" name="password" required
                 class="w-full border border-slate-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
      </div>
      
      <div class="pt-4">
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-4 rounded-md transition-colors shadow-sm">
            Verify
        </button>
      </div>
  </form>
</div>
{% endblock %}
