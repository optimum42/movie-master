{% extends "base.html" %}

{% block title %}Users - Movie Library{% endblock %}

{% block nav_buttons %}
  <form action="/add_user" method="POST" class="flex items-center gap-2">
    <label for="name" class="sr-only">User Name</label>
    <input type="text" id="name" name="name" placeholder="New User Name..." required
           class="w-48 md:w-64 border-0 rounded-md px-3 py-1.5 text-sm text-slate-900 focus:ring-2 focus:ring-indigo-300 outline-none transition-all shadow-inner">

    <button type="submit"
            class="bg-indigo-800 hover:bg-indigo-900 text-white text-sm font-semibold py-1.5 px-4 rounded-md transition-colors shadow-sm whitespace-nowrap border border-indigo-700">
      Add User
    </button>
  </form>
{% endblock %}

{% block content %}
  <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Users</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for user in users %}
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex gap-5 transition-transform duration-200 hover:-translate-y-1 hover:shadow-md group">
      <div class="flex flex-col flex-grow">
        <h3 class="text-lg font-bold text-slate-900 leading-tight mb-1">{{ user.name }}</h3>
        <div class="mt-auto flex flex-wrap gap-2 pt-4">
          <form action="/users/{{ user.id }}/movies">
            <button type="submit"
                    class="text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 px-3 py-1.5 rounded transition-colors">
              View Movies
            </button>
          </form>
        </div>
      </div>
    </div>
    {% else %}
      <div class="col-span-full bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center">
        <div class="text-4xl mb-4">📭</div>
          <p class="text-slate-500 mb-6">No Users available yet.</p>
      </div>
    {% endfor %}
  </div>
{% endblock %}
